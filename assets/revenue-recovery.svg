<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="640" height="320" rx="16" fill="#fcfcfb" />

  <text x="24" y="32" font-size="15" font-weight="600" fill="#0b0b0b">Toon Blast'ta "Super Light Ball" sonrası toparlanma</text>
  <text x="24" y="52" font-size="12" fill="#52514e">Kaynak: Deconstructor of Fun, Udonis (kamuya açık veriler) — Ekim 2023 lansmanı sonrası</text>

  <!-- Panel 1: Monthly revenue -->
  <g transform="translate(24,90)">
    <text x="0" y="0" font-size="12.5" font-weight="600" fill="#0b0b0b">Aylık gelir (ortalama, milyon $)</text>
    <line x1="0" y1="210" x2="260" y2="210" stroke="#c3c2b7" stroke-width="1" />

    <!-- 2023 avg $16.6M -->
    <rect x="40" y="150" width="56" height="60" rx="4" fill="#2a78d6" />
    <text x="68" y="140" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">$16.6M</text>
    <text x="68" y="228" font-size="12" fill="#52514e" text-anchor="middle">2023 ort.</text>

    <!-- early 2024 $35M -->
    <rect x="150" y="40" width="56" height="170" rx="4" fill="#eb6834" />
    <text x="178" y="30" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">$35M+</text>
    <text x="178" y="228" font-size="12" fill="#52514e" text-anchor="middle">2024 başı</text>
  </g>

  <!-- Panel 2: US ARPDAU -->
  <g transform="translate(340,90)">
    <text x="0" y="0" font-size="12.5" font-weight="600" fill="#0b0b0b">ABD ARPDAU (kullanıcı başı</text>
    <text x="0" y="16" font-size="12.5" font-weight="600" fill="#0b0b0b">günlük gelir)</text>
    <line x1="0" y1="210" x2="260" y2="210" stroke="#c3c2b7" stroke-width="1" />

    <!-- before ~$0.27 -->
    <rect x="40" y="204" width="56" height="6" rx="2" fill="#2a78d6" />
    <text x="68" y="194" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">~$0.27</text>
    <text x="68" y="228" font-size="12" fill="#52514e" text-anchor="middle">Öncesi</text>

    <!-- after $2-3 -->
    <rect x="150" y="40" width="56" height="170" rx="4" fill="#eb6834" />
    <text x="178" y="30" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">$2–3</text>
    <text x="178" y="228" font-size="12" fill="#52514e" text-anchor="middle">Sonrası</text>
  </g>
</svg>
